<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting…</title>

  <!-- Google Analytics (GA4) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-W6E1NYYT3G"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-W6E1NYYT3G');
    gtag('event', 'instagram_click', {
      campaign: 'ig/endless-thread',
      destination: 'https://open.spotify.com/episode/6xzTalcSnElY4YmOwJSWYO'
    });

  <!-- Fallback redirect for no-JS clients -->
  <meta http-equiv="refresh" content="2;url=https://open.spotify.com/episode/6xzTalcSnElY4YmOwJSWYO">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f8f9fa;
      color: #333;
    }
    .card {
      text-align: center;
      padding: 2rem;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #e0e0e0;
      border-top: 3px solid #333;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    a { color: #0066cc; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <p>Redirecting…</p>
    <p><small><a href="https://open.spotify.com/episode/6xzTalcSnElY4YmOwJSWYO">Click here</a> if not redirected automatically.</small></p>
  </div>

  <script>
    // Brief delay so the GA event has time to fire before navigation
    setTimeout(function() {
      window.location.href = 'https://open.spotify.com/episode/6xzTalcSnElY4YmOwJSWYO';
    }, 400);
  </script>
</body>
</html>
