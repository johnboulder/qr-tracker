<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logan Garage Events</title>

  <!-- Google Analytics (GA4) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-W6E1NYYT3G"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-W6E1NYYT3G', { 'transport_type': 'beacon' });
    gtag('event', 'direct_visit', {
      campaign: 'homepage',
      transport_type: 'beacon'
    });

    function trackClick(e, slug, dest) {
      if (e && e.preventDefault) e.preventDefault();
      gtag('event', 'event_click', {
        campaign: slug,
        destination: dest,
        transport_type: 'beacon'
      });
      setTimeout(function() {
        window.location.href = dest;
      }, 150);
    }
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #f4f5f7;
      color: #222;
      padding: 2.5rem 1rem;
    }
    .container {
      max-width: 520px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
    }
    .subtitle {
      color: #666;
      margin-bottom: 2rem;
      font-size: 1rem;
      font-weight: 500;
    }
    .card {
      display: block;
      background: #fff;
      border: 1px solid #e2e5eb;
      border-radius: 16px;
      margin-bottom: 2rem;
      text-decoration: none;
      color: #222;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
      cursor: pointer;
    }
    .card:hover, .card:active {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      border-color: #0066cc;
    }
    .flyer-img-wrap {
      width: 100%;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #f0f0f0;
    }
    .flyer-img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.25rem;
      background: #fff;
    }
    .label {
      font-weight: 700;
      font-size: 1.05rem;
      text-align: left;
      line-height: 1.3;
    }
    .rsvp-btn {
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      background: #0066cc;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.55rem 1rem;
      border-radius: 8px;
      transition: background 0.15s;
    }
    .card:hover .rsvp-btn {
      background: #0052a3;
    }
    .arrow {
      font-size: 1.3rem;
      color: #0066cc;
      flex-shrink: 0;
      margin-left: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Logan Garage</h1>
    <p class="subtitle">Upcoming Events</p>
    
      <a href="https://partiful.com/e/lK4K9THE3LtAizqQyOuQ" class="card flyer-card" onclick="trackClick(event, 'balltap', 'https://partiful.com/e/lK4K9THE3LtAizqQyOuQ')">
        <div class="flyer-img-wrap">
          <img src="assets/balltap-flyer.png" alt="BallTap - Friday, Oct 30th 7:30PM" class="flyer-img" loading="eager">
        </div>
        <div class="card-footer">
          <span class="label">BallTap - Friday, Oct 30th 7:30PM</span>
          <span class="rsvp-btn">RSVP &amp; Tickets &rarr;</span>
        </div>
      </a>
      <a href="https://partiful.com/e/jfjbqzk4XOj45i2hHSFc" class="card flyer-card" onclick="trackClick(event, 'garage-comedy-show', 'https://partiful.com/e/jfjbqzk4XOj45i2hHSFc')">
        <div class="flyer-img-wrap">
          <img src="assets/garage-comedy-flyer.png" alt="Garage Comedy Show - Thursday Nov 5th 7:30PM" class="flyer-img" loading="eager">
        </div>
        <div class="card-footer">
          <span class="label">Garage Comedy Show - Thursday Nov 5th 7:30PM</span>
          <span class="rsvp-btn">RSVP &amp; Tickets &rarr;</span>
        </div>
      </a>
  </div>
</body>
</html>
