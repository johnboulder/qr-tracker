<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logan Garage Events</title>

  <!-- Google Analytics (GA4) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-W6E1NYYT3G"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-W6E1NYYT3G');
    gtag('event', 'direct_visit', {
      campaign: 'homepage'
    });

    function trackClick(slug, dest) {
      gtag('event', 'event_click', {
        campaign: slug,
        destination: dest
      });
    }
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f8f9fa;
      color: #333;
      padding: 2rem;
    }
    .container {
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      color: #666;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }
    .card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      padding: 1.2rem 1.5rem;
      margin-bottom: 1rem;
      text-decoration: none;
      color: #333;
      transition: box-shadow 0.15s, border-color 0.15s;
    }
    .card:hover {
      border-color: #0066cc;
      box-shadow: 0 2px 12px rgba(0, 102, 204, 0.12);
    }
    .label {
      font-weight: 600;
      font-size: 1.05rem;
      text-align: left;
    }
    .arrow {
      font-size: 1.3rem;
      color: #0066cc;
      flex-shrink: 0;
      margin-left: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Logan Garage</h1>
    <p class="subtitle">Upcoming Events</p>
    
      <a href="https://partiful.com/e/IsBIQ6Pjz5RVOAuNf7Ln" class="card" onclick="trackClick('garage-comedy-show', 'https://partiful.com/e/IsBIQ6Pjz5RVOAuNf7Ln')">
        <span class="label">Garage Comedy Show - Saturday, Oct 17th 7:00PM</span>
        <span class="arrow">&rarr;</span>
      </a>
      <a href="https://partiful.com/e/lK4K9THE3LtAizqQyOuQ" class="card" onclick="trackClick('balltap', 'https://partiful.com/e/lK4K9THE3LtAizqQyOuQ')">
        <span class="label">BallTap - Friday, Oct 30th 7:30PM</span>
        <span class="arrow">&rarr;</span>
      </a>
  </div>
</body>
</html>
